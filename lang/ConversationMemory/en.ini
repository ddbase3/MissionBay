[router]
description = "Routes one conversation memory between database and session storage."
authenticated = "Database memory for authenticated users."
anonymous = "Session memory for anonymous users."

[database]
namespace = "Namespace for isolating saved conversations."
max = "Maximum messages per node when trimming is enabled."
trim = "Limit stored node history."
priority = "Execution priority for this memory."
encryption = "Optional encryption of newly written conversation data."
method = "Encryption method; none keeps content unencrypted."
key_id = "Identifier of the selected encryption key."
keys = "Key identifiers mapped to BASE3 secret-value sources (env, file or configuration)."
invalid_nesting = "Encryption configuration has an extra encryption wrapper. Expected encryption.method, not encryption.encryption.method."
unknown_setting = "Unknown encryption setting. Allowed: method, key_id, keys."
missing_method = "Encryption settings require an explicit method; choose none to disable encryption."
invalid_method = "Encryption method must be a non-empty string."
invalid_key_id = "Encryption key_id must be a string."
invalid_source_reference = "Persistent chatbot conversations require a valid configuration group and name."
