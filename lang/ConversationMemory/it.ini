[router]
description = "Instrada la memoria delle conversazioni tra database e sessione."
authenticated = "Archivio database per utenti autenticati."
anonymous = "Archivio di sessione per utenti anonimi."

[database]
namespace = "Spazio dei nomi per separare le conversazioni."
max = "Numero massimo di messaggi per nodo con limite attivo."
trim = "Limita la cronologia memorizzata."
priority = "Priorità di esecuzione della memoria."
encryption = "Cifratura facoltativa dei nuovi dati delle conversazioni."
method = "Metodo di cifratura; none mantiene il testo in chiaro."
key_id = "Identificatore della chiave di cifratura scelta."
keys = "Identificatori di chiave associati a sorgenti di segreti BASE3."
