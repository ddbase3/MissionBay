[router]
description = "Dirige el almacenamiento de conversaciones entre base de datos y sesión."
authenticated = "Almacenamiento en base de datos para usuarios autenticados."
anonymous = "Almacenamiento de sesión para usuarios anónimos."

[database]
namespace = "Espacio de nombres para separar conversaciones guardadas."
max = "Máximo de mensajes por nodo cuando se limita el historial."
trim = "Limitar el historial guardado."
priority = "Prioridad de ejecución del almacenamiento."
encryption = "Cifrado opcional de nuevos datos de conversación."
method = "Método de cifrado; none deja el contenido sin cifrar."
key_id = "Identificador de la clave de cifrado seleccionada."
keys = "Identificadores de claves asociados a fuentes de secretos BASE3."
invalid_nesting = "La configuración de cifrado contiene un nivel encryption adicional. Se espera encryption.method, no encryption.encryption.method."
unknown_setting = "Ajuste de cifrado desconocido. Permitidos: method, key_id, keys."
missing_method = "Debe indicarse method explícitamente; none desactiva el cifrado."
invalid_method = "El método de cifrado debe ser una cadena no vacía."
invalid_key_id = "El campo key_id debe ser una cadena."

